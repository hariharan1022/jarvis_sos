version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: safenova-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
      - ./backend/safenova.db:/app/safenova.db # Remove this line when using PostgreSQL
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - safenova-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: safenova-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - safenova-net

volumes:
  uploads_data:

networks:
  safenova-net:
    driver: bridge
